name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: jvm
            os: ubuntu-latest
            task: jvmTest
          - platform: js
            os: ubuntu-latest
            task: jsTest
          - platform: wasm
            os: ubuntu-latest
            task: wasmJsBrowserTest
          - platform: android-unit
            os: ubuntu-latest
            task: testDebugUnitTest
          - platform: ios-simulator
            os: macos-latest
            task: iosSimulatorArm64Test
          - platform: ios-x64
            os: macos-latest
            task: iosX64Test

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Set up Android SDK
      if: matrix.platform == 'android-unit'
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run ${{ matrix.platform }} Tests
      run: ./gradlew :stripe:${{ matrix.task }} --no-daemon

    - name: Upload Test Reports
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: test-reports-${{ matrix.platform }}
        path: |
          stripe/build/reports/tests/${{ matrix.task }}/
          stripe/build/test-results/${{ matrix.task }}/

  android-instrumentation-tests:
    name: Android Instrumentation Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Set up Android SDK
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run connected Android tests
      uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2
      with:
        api-level: 30
        target: google_apis
        arch: x86_64
        emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot-save
        script: ./gradlew :stripe:connectedDebugAndroidTest --no-daemon

    - name: Upload Android Test Reports
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: android-instrumentation-test-reports
        path: |
          stripe/build/reports/androidTests/connected/
          stripe/build/outputs/androidTest-results/connected/

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Coverage Report
      run: ./gradlew :stripe:koverXmlReport --no-daemon

    - name: Verify Coverage Threshold
      run: ./gradlew :stripe:koverVerify --no-daemon

    - name: Upload Coverage Reports
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: coverage-reports
        path: stripe/build/reports/kover/

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            task: assembleRelease
          - target: jvm
            os: ubuntu-latest
            task: jvmJar
          - target: js
            os: ubuntu-latest
            task: jsJar
          - target: ios-framework
            os: macos-latest
            task: linkReleaseFrameworkIosArm64

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build ${{ matrix.target }}
      run: ./gradlew :stripe:${{ matrix.task }} --no-daemon

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Only run on pushes or PRs from same repo (secrets not available on fork PRs)
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Integration Tests
      env:
        STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
      run: |
        if [ -n "$STRIPE_PUBLISHABLE_KEY" ]; then
          echo "Running integration tests with Stripe API..."
          ./gradlew :stripe:jvmTest --no-daemon -DSTRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY"
        else
          echo "STRIPE_PUBLISHABLE_KEY not set, skipping real API integration tests"
          echo "Unit tests will still run and validate test infrastructure"
          ./gradlew :stripe:jvmTest --no-daemon
        fi

    - name: Upload Integration Test Reports
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: integration-test-reports
        path: |
          stripe/build/reports/tests/jvmTest/
          stripe/build/test-results/jvmTest/

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

    - name: Run Android Lint
      run: ./gradlew :stripe:lintDebug --no-daemon

    - name: Upload Lint Reports
      if: always()
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: lint-reports
        path: stripe/build/reports/lint-results-debug.html

  api-check:
    name: API Compatibility
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

    - name: Set up JDK 17
      uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e # v5.1.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

    - name: Check API Compatibility
      run: ./gradlew :stripe:apiCheck --no-daemon
      continue-on-error: true  # Don't fail if apiCheck isn't configured
