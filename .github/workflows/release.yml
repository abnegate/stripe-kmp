name: Release to Maven Central

on:
  release:
    types: [published]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  release:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract version from release tag
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Update version in build.gradle.kts
      run: |
        # Only replace the project version (unindented), not pod versions (indented)
        sed -i '' "s/^version = \".*\"/version = \"${{ steps.version.outputs.VERSION }}\"/" stripe/build.gradle.kts

    - name: Build and Test
      run: ./gradlew :stripe:check --no-daemon

    - name: Publish to Maven Central
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
      run: ./gradlew :stripe:publishAndReleaseToMavenCentral --no-daemon

    - name: Build iOS XCFramework
      run: ./gradlew :stripe:assembleStripeKMPReleaseXCFramework --no-daemon || true
