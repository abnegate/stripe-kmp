name: Release to Maven Central

on:
  release:
    types: [published]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false"

jobs:
  release:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update version in build.gradle.kts
      run: |
        sed -i '' "s/version = \".*\"/version = \"${{ steps.version.outputs.VERSION }}\"/" stripe/build.gradle.kts

    - name: Build and Test
      run: ./gradlew :stripe:check --no-daemon

    - name: Publish to Maven Central
      env:
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
        SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      run: ./gradlew :stripe:publishAllPublicationsToSonatypeRepository --no-daemon

    - name: Build iOS XCFramework
      run: ./gradlew :stripe:assembleStripeKMPReleaseXCFramework --no-daemon || true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          ## Installation

          ### Gradle (Android/JVM)
          ```kotlin
          implementation("com.jakebarnby:stripe-kmp:${{ steps.version.outputs.VERSION }}")
          ```

          ### CocoaPods (iOS)
          ```ruby
          pod 'StripeKMP', '~> ${{ steps.version.outputs.VERSION }}'
          ```

          ### npm (JavaScript)
          ```bash
          npm install @jakebarnby/stripe-kmp@${{ steps.version.outputs.VERSION }}
          ```
        generate_release_notes: true
        files: |
          stripe/build/outputs/aar/*.aar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Close and release the staging repository
  close-staging:
    needs: release
    runs-on: ubuntu-latest

    steps:
    - name: Close and Release Staging Repository
      env:
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
      run: |
        # Find staging repository
        STAGING_REPO=$(curl -s -u "$OSSRH_USERNAME:$OSSRH_PASSWORD" \
          "https://s01.oss.sonatype.org/service/local/staging/profile_repositories" | \
          grep -oP '(?<=<repositoryId>)[^<]+' | head -1)

        if [ -n "$STAGING_REPO" ]; then
          # Close staging repository
          curl -s -u "$OSSRH_USERNAME:$OSSRH_PASSWORD" -X POST \
            "https://s01.oss.sonatype.org/service/local/staging/bulk/close" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"stagedRepositoryIds\":[\"$STAGING_REPO\"],\"description\":\"Closing\"}}"

          echo "Waiting for repository to close..."
          sleep 60

          # Release staging repository
          curl -s -u "$OSSRH_USERNAME:$OSSRH_PASSWORD" -X POST \
            "https://s01.oss.sonatype.org/service/local/staging/bulk/promote" \
            -H "Content-Type: application/json" \
            -d "{\"data\":{\"stagedRepositoryIds\":[\"$STAGING_REPO\"],\"description\":\"Releasing\"}}"

          echo "Release complete!"
        fi
